# Evaluation queries for scripts/evaluate.py (Requirement 16).
#
# Rules (16.1): 15 to 20 entries; text is 1-200 characters; camera_id must exist in the
# Metadata_Store; start/end are ISO 8601 date-times (no UTC offset = local time) and end must be
# later than start. The window is the ground-truth time range in which the described thing is
# visible on that camera. An Event counts as relevant when its camera matches and its padded
# window overlaps [start, end] inclusively (16.2).
#
# The first two entries match the default synthetic video from scripts/make_synthetic.py
# (camera CAM-SYN01, video start 2025-01-01T08:00:00, red square 10-25 s, blue circle 50-65 s).
#
# Integrator: replace every entry marked TODO with a real query on ingested footage. Set
# camera_id to a real camera ID and start/end to the ground-truth times read from the footage.
# Until filled in, the placeholders reference camera CAM01 and are reported as errors
# ("camera ID ... is not in the Metadata_Store") without stopping the run (16.7).

